{{define "content"}}
    <div class="page-head clearfix">
        <h3 class="float-left">Daftar Produk</h3>
        <a href="/produk/form" class="btn float-right">+ Tambah Produk</a>
    </div>
    <table class="table">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Produk</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Keterangan</th>
                <th>Dibuat</th>
            </tr>
        </thead>
        <tbody>
            {{range $i, $p := .}}
            <tr>
                <td>{{add_one $i}}</td>
                <td><a href="/produk/{{$p.ID}}">{{$p.Name}}</a></td>
                <td>{{rupiah $p.Price}}</td>
                <td>{{$p.Stok}}</td>
                <td>{{$p.Ket}}</td>
                <td>{{$p.CreatedAt.Format "02-01-2006 15:04"}}</td>
            </tr>
            {{else}}
            <tr>
                <td colspan="6">Belum ada produk.</td>
            </tr>
            {{end}}
        </tbody>
    </table>
{{end}}
