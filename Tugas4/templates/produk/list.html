{{define "content"}}
<div class="page-head clearfix">
  <h3 class="float-left">Daftar Produk</h3>
  <a href="/produk/form" class="btn float-right">+ Tambah Produk</a>
</div>
<table class="table">
  <thead>
    <tr>
      <th width="50px">ID</th>
      <th>Nama Produk</th>
      <th class="num">Harga</th>
      <th>Stok</th>
      <th>Keterangan</th>
      <th>Created At</th>
      <th width="100px">Aksi</th>
    </tr>
  </thead>
  <tbody>
    {{range .}}
    <tr>
      <td>{{.ID}}</td>
      <td>{{.Name}}</td>
      <td class="num">{{rupiah .Price}}</td>
      <td>{{.Stok}}</td>
      <td>{{.Ket}}</td>
      <td>{{.CreatedAt.Format "Monday, 2 Jan 2006 (3.04.05PM) ~MST"}}</td>
      <td>
        <form
          action="/produk/{{.ID}}/hapus"
          method="POST"
          style="margin: 0"
          onsubmit="return confirm('Yakin ingin menghapus produk ini?');"
        >
          <button type="submit" class="btn">Hapus</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{end}}
